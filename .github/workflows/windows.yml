name: Windows

# Ветка windows: сборка Mac Utils Share для Windows на Windows-машине GitHub
# и обновление релиза «windows-latest» (pre-release — Mac Utils его не трогает).
# Версия: MAJOR.MINOR из windows/package.json + PATCH = номер запуска (docs/VERSIONING.md §2); приложение подхватывает её через latest.yml.
# Права (аудит M4): сборка — только чтение, токен не остаётся в .git/config (npm-пакеты сборки его не прочтут); право записи —
# только у задачи публикации, которая не ставит пакетов и не запускает кода из репозитория: берёт готовые файлы сборки.
# Публикация — только с ветки windows: ветки fix/** (и ручной запуск на другой ветке) собирают и тестируют, релиз не трогают.
on:
  push:
    branches: [windows, "fix/**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Помощник mu-audio.exe (звук программ, положение окон)
        shell: cmd
        run: |
          mkdir bin
          cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE native\mu-audio.cpp /Fe:bin\mu-audio.exe /Fo:bin\
      - name: Тесты
        run: npm test --if-present
      - name: Версия
        id: version
        shell: bash
        run: |
          LINE=$(node -p "const v=require('./package.json').version.split('.'); if (v.length!==3 || v.some(x=>!/^\\d+$/.test(x))) throw new Error('bad version'); v[0]+'.'+v[1]")
          VERSION="$LINE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Сборка установщика
        run: npx electron-builder --win nsis --publish never
      - name: Файлы для публикации
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            windows/dist/MacUtilsShare-Setup.exe
            windows/dist/MacUtilsShare-Setup.exe.blockmap
            windows/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/windows'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: dist
      - name: Релиз windows-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          NOTES="Mac Utils Share для Windows $VERSION — трансляция экрана по коду и просмотр. Скачайте MacUtilsShare-Setup.exe; дальше приложение обновляется само."
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release edit windows-latest --title "Mac Utils Share для Windows $VERSION" --notes "$NOTES" --prerelease
          else
            gh release create windows-latest --title "Mac Utils Share для Windows $VERSION" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload windows-latest dist/MacUtilsShare-Setup.exe dist/MacUtilsShare-Setup.exe.blockmap dist/latest.yml --clobber
