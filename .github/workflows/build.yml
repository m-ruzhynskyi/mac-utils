name: CI

# development и pull request'ы — сборка и тесты.
# main (после слияния из development) — тесты (или результат тех же тестов из PR при том же дереве),
# подписанная универсальная сборка и релиз. Тесты делятся на 4 шарда: scripts/test-shard.sh.
# Кэш сборки (.build): сохраняет только задача app при push (development, main) и ручном запуске, после универсальной
# сборки приложения; PR и релиз его только восстанавливают. Время файлов выставляется по содержимому
# (scripts/ci-restore-mtime.py), иначе после checkout SwiftPM пересобирает всё. Кэш лишь ускоряет: при расхождении
# файл пересобирается; «no_cache» в ручном запуске — чистая сборка. Ключ — тулчейн раннера и Package.swift.
# Тесты PR, меняющего только модули (Sources/MU<Модуль>/, Tests/MU<Модуль>Tests/), гоняются только у затронутых целей
# и их зависимых (scripts/ci-test-scope.py); всё остальное и PR в main — все тесты.
# Версия: MAJOR.MINOR из Resources/Info.plist, PATCH = наибольший тег линии + 1 (scripts/version.sh, docs/VERSIONING.md).
# Тег vX.Y.Z создаёт только задача release.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Не восстанавливать и не сохранять кэш сборки (чистая сборка для проверки кэша)"
        type: boolean
        default: false

permissions:
  contents: read

# Новый push или новый коммит в PR отменяет устаревший прогон PR; push'и одной ветки идут по очереди
# (выпуски не отменяются, а ожидающий push в main всё равно пропустил бы свой релиз — см. «Check tag»).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # push в main или development = merge PR. Если дерево этого коммита уже прошло все тесты
  # в прогоне того же PR (в ту же ветку), тесты второй раз не гоняются. Любое сомнение — тесты как обычно.
  tested-tree:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - name: Find PR run that tested this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Шаг не падает: ошибка API = «не доказано», и тесты идут как обычно.
          set +e
          echo "tested=false" >> "$GITHUB_OUTPUT"
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\" and .base.ref == \"$BRANCH\" and .head.repo.full_name == \"$REPO\")][0] | \"\(.number) \(.head.sha)\"")
          read -r PR_NUMBER HEAD_SHA <<< "$PR"
          if [[ -z "$TREE" || -z "$HEAD_SHA" || "$HEAD_SHA" == "null" ]]; then
            echo "::notice::Коммит $SHA не merge PR в $BRANCH — тесты как обычно."; exit 0
          fi
          # Артефакт tested-tree-<дерево> кладёт задача test только после того, как прошли все шарды.
          for RUN in $(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$TREE&per_page=100" \
              --jq ".artifacts[] | select(.expired == false and .workflow_run.head_sha == \"$HEAD_SHA\") | .workflow_run.id"); do
            OK=$(gh api "repos/$REPO/actions/runs/$RUN" --jq "
              .event == \"pull_request\" and .conclusion == \"success\" and .path == \".github/workflows/build.yml\"
              and .head_sha == \"$HEAD_SHA\" and .head_repository.full_name == \"$REPO\"")
            if [[ "$OK" == "true" ]]; then
              echo "::notice::Дерево $TREE прошло тесты в прогоне $RUN (PR #$PR_NUMBER) — повторно не гоняю."
              echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::notice::Нет успешного прогона PR #$PR_NUMBER с деревом $TREE — тесты как обычно."

  # Секунды, до macOS-раннеров: импорты MU* против dependencies в Package.swift и слои модулей.
  # Локальная инкрементальная сборка пропускает отсутствующую зависимость, чистая — падает.
  module-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Self-test
        run: python3 scripts/check-module-deps.py --self-test
      - name: Module dependencies
        run: python3 scripts/check-module-deps.py

  test-shard:
    needs: [tested-tree, module-deps]
    # tested-tree пропущена (не push в main/development) или упала — outputs пустые, тесты идут.
    if: ${{ !cancelled() && needs.module-deps.result == 'success' && needs.tested-tree.outputs.tested != 'true' }}
    name: test-shard ${{ matrix.shard }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Toolchain
        id: toolchain
        run: echo "id=$( (swift --version; xcodebuild -version) 2>&1 | shasum | cut -c1-12 )" >> "$GITHUB_OUTPUT"
      - name: Restore build cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: File times from content
        run: python3 scripts/ci-restore-mtime.py
      - name: Build
        run: swift build --build-tests
      - name: Test
        env:
          SHARD_REPORT: ${{ runner.temp }}/shard-${{ matrix.shard }}.txt
          # PR в development: только затронутые модули (если изменены только они); остальное — все тесты.
          TEST_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && github.event.pull_request.base.sha || '' }}
        run: ./scripts/test-shard.sh "${{ matrix.shard }}" "$SHARDS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.txt
          retention-days: 3
          overwrite: true

  # Тесты скриптов и relay, сборка приложения и кэш .build — рядом с шардами, не в одном из них:
  # так все четыре шарда делят только тесты.
  app:
    needs: [tested-tree, module-deps]
    # При push в development работает и когда тесты переиспользованы: сборка кладёт кэш для следующих прогонов.
    if: ${{ !cancelled() && needs.module-deps.result == 'success' && (needs.tested-tree.outputs.tested != 'true' || github.ref == 'refs/heads/development') }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Script tests
        run: ./scripts/test-version.sh && python3 scripts/test-shard.py --self-test && python3 scripts/ci-test-scope.py --self-test
      - name: Relay regression tests
        run: npm test --prefix relay
      - name: Toolchain
        id: toolchain
        run: echo "id=$( (swift --version; xcodebuild -version) 2>&1 | shasum | cut -c1-12 )" >> "$GITHUB_OUTPUT"
      # PR кэш не использует: его сборка приложения идёт под одну архитектуру и ничего в кэш не кладёт.
      - name: Restore build cache
        if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: File times from content
        run: python3 scripts/ci-restore-mtime.py
      # Debug-сборка тестов нужна только чтобы в кэш попало то, что восстанавливают шарды.
      - name: Build tests (for the cache)
        if: ${{ github.event_name != 'pull_request' }}
        run: swift build --build-tests
      # Ad-hoc сборка без секретов: ловит поломки build.sh и подписи. В PR — под текущую архитектуру;
      # при push и ручном запуске — универсальная, как в релизе: её результат кладётся в кэш и ускоряет релиз.
      - name: Build app (ad-hoc)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            env -u SIGN_IDENTITY ./build.sh
          else
            env -u SIGN_IDENTITY ./build.sh --universal
          fi
          codesign --verify --deep --strict "build/Mac Utils.app"
          # Значки документов: все .icns в бандле, каждый CFBundleTypeIconFile/UTTypeIconFile указывает на файл.
          ./scripts/check-doc-icons.sh "build/Mac Utils.app"
          # Hardened Runtime на приложении и вложенном коде: без него другая программа может внедрить библиотеку в Mac Utils.
          for item in "build/Mac Utils.app" "build/Mac Utils.app/Contents/Resources/Инструменты.app" "build/Mac Utils.app/Contents/Resources/MUNowPlaying.dylib"; do
            codesign -dv "$item" 2>&1 | grep -Eq "flags=0x[0-9a-f]+\([^)]*runtime" || { echo "::error::Нет Hardened Runtime: $item"; exit 1; }
          done
      - name: Trim build cache
        if: ${{ success() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
        run: rm -rf .build/index-build .build/arm64-apple-macosx/release .build/x86_64-apple-macosx/release
      - name: Save build cache
        if: ${{ success() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}

  # Обязательная проверка «test» в правилах main: зелёная, только если все шарды прошли и вместе
  # выполнили все тесты одного дерева, либо это дерево уже прошло тесты в PR (tested-tree).
  test:
    needs: [tested-tree, module-deps, test-shard, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Module dependencies
        if: needs.module-deps.result != 'success'
        run: echo "::error::Проверка зависимостей модулей (module-deps) не прошла"; exit 1
      - name: Reused PR result
        if: needs.tested-tree.outputs.tested == 'true' && needs.test-shard.result == 'skipped' && (needs.app.result == 'skipped' || needs.app.result == 'success')
        run: echo "Тесты этого дерева прошли в прогоне PR — см. задачу tested-tree."
      - name: Shards
        if: needs.tested-tree.outputs.tested != 'true' || needs.test-shard.result != 'skipped' || (needs.app.result != 'skipped' && needs.app.result != 'success')
        run: |
          if [[ "${{ needs.test-shard.result }}" != "success" || "${{ needs.app.result }}" != "success" ]]; then
            echo "::error::Шарды тестов: ${{ needs.test-shard.result }}, сборка и скрипты: ${{ needs.app.result }}"; exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.test-shard.result == 'success'
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: All tests ran once
        id: sum
        if: needs.test-shard.result == 'success'
        run: |
          cat shards/shard-*.txt
          field() { sed -n "s/.*$1=\([^ ]*\).*/\1/p" shards/shard-*.txt; }
          REPORTS=(shards/shard-*.txt)
          [[ ${#REPORTS[@]} -eq 4 ]] || { echo "::error::Нет отчёта одного из шардов"; exit 1; }
          [[ $(field listed | sort -u | wc -l) -eq 1 && $(field tree | sort -u | wc -l) -eq 1 ]] \
            || { echo "::error::Шарды видели разные списки тестов или разные деревья"; exit 1; }
          LISTED=$(field listed | head -1)
          EXECUTED=$(field executed | awk '{s += $1} END {print s}')
          [[ "$EXECUTED" == "$LISTED" ]] || { echo "::error::Выполнено $EXECUTED тестов из $LISTED"; exit 1; }
          echo "Выполнено $EXECUTED из $LISTED тестов в 4 шардах." >> "$GITHUB_STEP_SUMMARY"
          [[ $(field scope | sort -u | wc -l) -eq 1 ]] || { echo "::error::Шарды выбрали разную область тестов"; exit 1; }
          SCOPE=$(field scope | head -1)
          echo "Область тестов: $SCOPE" >> "$GITHUB_STEP_SUMMARY"
          # Метка «дерево прошло все тесты» — только если гонялись все тесты, не часть.
          TREE=""
          [[ "$SCOPE" == "all" ]] && TREE=$(field tree | head -1)
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "$TREE" > tested-tree.txt
      # Метка для push в main/development после merge: это дерево уже прошло все тесты (см. tested-tree).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'development') && steps.sum.outputs.tree != ''
        with:
          name: tested-tree-${{ steps.sum.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
          overwrite: true

  release:
    needs: test
    # !cancelled() вместо неявного success(): иначе пропущенные шарды (тесты уже прошли в PR) пропустили бы и релиз.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    # Два push в main подряд не должны считать версию одновременно.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # SHA-1 листового сертификата «Mac Utils Signing»: на нём держится designated requirement автообновления.
      EXPECTED_LEAF_SHA1: b05f5c70f24685c18a6d61e2fb9b1ec60d9f713f
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Без постоянной подписи macOS сбросит разрешения после автообновления,
      # поэтому релиз публикуется только подписанным сертификатом «Mac Utils Signing».
      - name: Import signing certificate
        id: sign
        run: |
          if [[ -z "$SIGNING_P12" ]]; then
            echo "::warning::Нет секретов SIGNING_P12/SIGNING_PASSWORD — релиз не публикуется."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          echo "$SIGNING_P12" | base64 --decode > "$P12"
          # «Связка ключей» в новых macOS шифрует .p12 так, что `security` на раннере его
          # не читает. Проверяем пароль OpenSSL 3 и перепаковываем в совместимый формат.
          OPENSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [[ -x "$OPENSSL" ]] || OPENSSL=openssl
          # -legacy: «Связка ключей» может шифровать старым RC2, его OpenSSL 3 читает только так.
          if ! "$OPENSSL" pkcs12 -legacy -in "$P12" -passin env:SIGNING_PASSWORD -noout; then
            echo "::error::SIGNING_PASSWORD не подходит к SIGNING_P12 — загрузите секреты заново."
            exit 1
          fi
          "$OPENSSL" pkcs12 -legacy -in "$P12" -passin env:SIGNING_PASSWORD -nodes -out "$RUNNER_TEMP/signing.pem"
          "$OPENSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/signing.pem" -out "$RUNNER_TEMP/legacy.p12" \
            -passout env:SIGNING_PASSWORD -name "Mac Utils Signing"
          rm -f "$RUNNER_TEMP/signing.pem"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/legacy.p12" -k "$KEYCHAIN" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Mac Utils Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        id: toolchain
        run: echo "id=$( (swift --version; xcodebuild -version) 2>&1 | shasum | cut -c1-12 )" >> "$GITHUB_OUTPUT"
      # Кэш сохранён сборкой development при том же дереве: тогда универсальная сборка почти ничего не компилирует.
      - name: Restore build cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: File times from content
        run: python3 scripts/ci-restore-mtime.py

      - name: Build app
        env:
          MU_RELEASE: "1"
        run: ./build.sh --universal

      - name: Version
        run: |
          PLIST="build/Mac Utils.app/Contents/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          VERSION=$(pb CFBundleShortVersionString)
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Версия «$VERSION» не вида MAJOR.MINOR.PATCH"; exit 1
          fi
          EXPECTED_BUILD=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          if [[ "$(pb CFBundleVersion)" != "$EXPECTED_BUILD" ]]; then
            echo "::error::CFBundleVersion $(pb CFBundleVersion) ≠ $EXPECTED_BUILD"; exit 1
          fi
          # Без канала release Updater у всех пользователей молча перестанет ставить обновления.
          if [[ "$(pb MUReleaseChannel)" != "release" ]]; then
            echo "::error::MUReleaseChannel=$(pb MUReleaseChannel), ожидалось release"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          codesign -dvv "build/Mac Utils.app" 2>&1 | grep -E "Authority|Signature" || true

      # Тег не переиспользуется: он уже на этом коммите (перезапуск) или его ещё нет.
      - name: Check tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          # Пока этот запуск ждал очереди, в main мог уйти более новый коммит: его релиз выйдет сам, а этот был бы откатом.
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -n "$REMOTE_MAIN" && "$REMOTE_MAIN" != "$GITHUB_SHA" ]]; then
            echo "::notice::main уже ушёл вперёд ($REMOTE_MAIN), релиз $TAG для $GITHUB_SHA пропускаю."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 \
             && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Тег $TAG есть в origin, но не получен локально (неполный fetch)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Тег $TAG уже стоит на другом коммите — версия не переиспользуется"
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::notice::Релиз $TAG уже опубликован для этого коммита — пропускаю."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          APP="build/Mac Utils.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -Eq "flags=0x[0-9a-f]+\([^)]*runtime" || { echo "::error::Релиз без Hardened Runtime"; exit 1; }
          if ! codesign -dr - "$APP" 2>&1 | grep -q "certificate leaf = H\"$EXPECTED_LEAF_SHA1\""; then
            echo "::error::Релиз не подписан сертификатом «Mac Utils Signing» ($EXPECTED_LEAF_SHA1)"
            codesign -dr - "$APP" 2>&1 || true
            exit 1
          fi

      - name: Zip
        run: cd build && ditto -c -k --keepParent "Mac Utils.app" MacUtils.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacUtils-${{ env.VERSION }}
          path: build/MacUtils.zip

      - name: Publish release
        if: steps.sign.outputs.signed == 'true' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/MacUtils.zip \
            --title "Mac Utils $VERSION" --generate-notes --target "$GITHUB_SHA"
