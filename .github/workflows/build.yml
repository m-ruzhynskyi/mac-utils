name: CI

# development и pull request'ы — сборка и тесты.
# main (после слияния из development) — тесты, подписанная универсальная сборка и релиз.
# Версия везде одна: <major.minor>.<число коммитов> — её считает build.sh.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Без постоянной подписи macOS сбросит разрешения после автообновления,
      # поэтому релиз публикуется только подписанным сертификатом «Mac Utils Signing».
      - name: Import signing certificate
        id: sign
        run: |
          if [[ -z "$SIGNING_P12" ]]; then
            echo "::warning::Нет секретов SIGNING_P12/SIGNING_PASSWORD — релиз не публикуется."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Mac Utils Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: ./build.sh --universal

      - name: Version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/Mac Utils.app/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          codesign -dvv "build/Mac Utils.app" 2>&1 | grep -E "Authority|Signature" || true

      - name: Zip
        run: cd build && ditto -c -k --keepParent "Mac Utils.app" MacUtils.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacUtils-${{ env.VERSION }}
          path: build/MacUtils.zip

      - name: Publish release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/MacUtils.zip \
            --title "Mac Utils $VERSION" --generate-notes --target "$GITHUB_SHA"
