<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Удалённые подключения</title>
<link rel="stylesheet" href="remote.css">
</head><body>
<div class="page" id="page">
  <div class="top">
    <div class="field" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="query" type="text" autocomplete="off" spellcheck="false" placeholder="Название, ID, группа, тег…" aria-label="Поиск">
      <span class="hint" id="layoutHint" hidden></span>
      <span class="key" id="hotkeyHint"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Программа"></div>
  </div>
  <div id="banner"></div>
  <div class="scroller" id="list" role="listbox" aria-label="Подключения"></div>
  <div id="diagBox"></div>
  <div class="bar" id="bar">
    <button class="btn c" id="openFile" title="Открыть файл в Excel или редакторе">Excel</button>
    <button class="btn c ic" id="reload" title="Перечитать файл" aria-label="Перечитать">⟳</button>
    <button class="btn c" id="addBtn" title="Добавить запись в XML" hidden>＋ Добавить</button>
    <button class="btn c ic" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙</button>
    <span class="sp"></span>
    <small id="summary" role="button" tabindex="0"></small>
  </div>
  <div class="hints" id="hints" hidden>
    <span><span class="key">↑↓</span> выбор</span><span><span class="key">↵</span> подключиться</span><span><span class="key">Ctrl ↵</span> без пароля</span>
    <span><span class="key">Tab</span> программа</span><span><span class="key">Ctrl F</span> избранное</span>
  </div>
</div>
<script src="remote.js"></script>
</body></html>
