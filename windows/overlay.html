<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script src="overlay-place.js"></script>
<script>
// Метки и рисунки зрителей поверх экрана ведущего (Windows). Логика рисования — как на странице трансляции.
// Точка зрителя — доля транслируемой области; где эта область в окне меток, присылает приложение (region).
const COLORS = { red: "#ff453a", yellow: "#ffd60a", green: "#30d158", blue: "#0a84ff", white: "#ffffff" };
const marks = [];
let area = null;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
window.overlay.onRegion((r) => { area = r; });
window.overlay.onMark((m) => { m.born = performance.now(); marks.push(m); if (marks.length === 1) requestAnimationFrame(render); });
function render() {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const now = performance.now(), map = (p) => overlayPlace.markPoint(p, area || { x: 0, y: 0, w, h });
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i], age = (now - m.born) / 1000, life = m.type === "ping" ? 1.6 : 5;
    if (age > life) { marks.splice(i, 1); continue; }
    const c = COLORS[m.color] || COLORS.red;
    if (m.type === "ping") {
      const [x, y] = map([m.x, m.y]);
      for (let wave = 0; wave < 3; wave++) {
        const t = age - wave * 0.25; if (t <= 0 || t >= 1) continue;
        ctx.globalAlpha = 1 - t; ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 10 + 46 * t, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1.1) / 0.5); ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    } else {
      const alpha = age < life - 1 ? 1 : Math.max(0, life - age);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const [lw, style, a] of [[7, "#000", 0.35], [4, c, 1]]) {
        ctx.globalAlpha = alpha * a; ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.beginPath();
        m.points.forEach((p, i) => { const [x, y] = map(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (marks.length) requestAnimationFrame(render); else ctx.clearRect(0, 0, w, h);
}
</script></body></html>
