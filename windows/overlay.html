<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh}
  /* Уведомление «‹имя› переключает на монитор N» (как на Mac): правый верхний угол области, 4 с, без кнопок. */
  :root { --panel: #171A1F; --field: #1F2329; --line: #2A2F37; --text: #EDEFF2; --mute: #9AA3AF; --acc: #C8F05A; --acc-ink: #10140A; }
  @media (prefers-color-scheme: light) { :root { --panel: #FFFFFF; --field: #EEF0EA; --line: #D9DDD3; --text: #14171A; --mute: #59626E; } }
  #notice { position: fixed; display: none; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px; background: var(--panel);
            border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0,0,0,.25); color: var(--text); font: 600 14px/1.3 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
            opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; }
  #notice.on { opacity: 1; transform: none; }
  #notice .ava { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--field); font-weight: 800; font-size: 13px; }
  #notice small { display: block; color: var(--mute); font-weight: 500; font-size: 12px; margin-top: 1px; }
  #notice .map { position: relative; flex: none; }
  #notice .map i { position: absolute; display: grid; place-items: center; border-radius: 5px; background: var(--field); border: 1px solid var(--line);
                   font: 800 10px/1 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; font-style: normal; box-sizing: border-box; }
  #notice .map i.cur { background: var(--acc); border-color: transparent; color: var(--acc-ink); }
  #notice .map i.main::before { content: ""; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 45%; height: 2px; border-radius: 1px; background: currentColor; opacity: .5; }
  @media (prefers-reduced-motion: reduce) { #notice { transition: none; } }
</style>
</head><body><canvas id="c"></canvas><div id="notice" aria-live="polite"></div>
<script src="overlay-place.js"></script>
<script>
// Метки и рисунки зрителей поверх экрана ведущего (Windows). Логика рисования — как на странице трансляции.
// Окно меток стоит ровно на мониторе транслируемой области; где в нём область, приложение присылает долями окна
// (region: fx, fy, fw, fh). Здесь доли умножаются на размер окна в каждом кадре — от devicePixelRatio это не зависит.
const COLORS = { red: "#ff453a", yellow: "#ffd60a", green: "#30d158", blue: "#0a84ff", white: "#ffffff" };
const marks = [];
let region = null;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const area = () => overlayPlace.areaIn(region || { fx: 0, fy: 0, fw: 1, fh: 1 }, innerWidth, innerHeight);
window.overlay.onRegion((r) => { region = r; });
window.overlay.onMark((m) => {
  m.born = performance.now(); marks.push(m); if (marks.length === 1) requestAnimationFrame(render);
  // Для журнала: где эта метка ляжет на холсте и какой страница видит своё окно (только числа).
  const first = m.type === "ping" ? [m.x, m.y] : m.points?.[0];
  if (first && window.overlay.report) {
    const now = area();
    window.overlay.report({ mark: first, point: overlayPlace.markPoint(first, now), area: now, region, innerWidth, innerHeight, dpr: devicePixelRatio });
  }
});
// Уведомление о переключении монитора: текст — только textContent (имя зрителя приходит от relay).
let noticeTimer = null;
window.overlay.onNotice?.((n) => {
  const box = document.getElementById("notice");
  box.textContent = "";
  const ava = document.createElement("span"); ava.className = "ava"; ava.textContent = n.name.slice(0, 1).toUpperCase();
  const text = document.createElement("div"); text.textContent = `${n.name} переключает на монитор ${n.n}`;
  const sub = document.createElement("small"); sub.textContent = "Зрители видят этот экран"; text.appendChild(sub);
  box.append(ava, text);
  if (n.list.length) {
    // Мини-схема мониторов ведущего высотой 22 px, текущий — лайм.
    const xs = n.list.map((d) => d.at[0]), ys = n.list.map((d) => d.at[1]);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    const maxX = Math.max(...n.list.map((d) => d.at[0] + d.at[2])), maxY = Math.max(...n.list.map((d) => d.at[1] + d.at[3]));
    const k = 22 / Math.max(maxY - minY, 1), map = document.createElement("span");
    map.className = "map"; map.style.width = `${(maxX - minX) * k - 3}px`; map.style.height = `${(maxY - minY) * k - 3}px`;
    for (const d of n.list) {
      const tile = document.createElement("i");
      Object.assign(tile.style, { left: `${(d.at[0] - minX) * k}px`, top: `${(d.at[1] - minY) * k}px`,
                                  width: `${Math.max(4, d.at[2] * k - 3)}px`, height: `${Math.max(4, d.at[3] * k - 3)}px` });
      tile.className = [d.primary ? "main" : "", d.n === n.n ? "cur" : ""].join(" ").trim();
      tile.textContent = d.n;
      map.appendChild(tile);
    }
    box.appendChild(map);
  }
  // Правый верхний угол транслируемой области (у экрана — всего окна меток).
  const a = area();
  box.style.display = "flex";
  box.style.left = ""; box.style.right = `${Math.max(8, innerWidth - (a.x + a.w) + 16)}px`; box.style.top = `${Math.max(8, a.y + 16)}px`;
  requestAnimationFrame(() => box.classList.add("on"));
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { box.classList.remove("on"); noticeTimer = setTimeout(() => { box.style.display = "none"; }, 250); }, 4000);
});
function render() {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const now = performance.now(), frame = area(), map = (p) => overlayPlace.markPoint(p, frame);
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i], age = (now - m.born) / 1000, life = m.type === "ping" ? 1.6 : 5;
    if (age > life) { marks.splice(i, 1); continue; }
    const c = COLORS[m.color] || COLORS.red;
    if (m.type === "ping") {
      const [x, y] = map([m.x, m.y]);
      for (let wave = 0; wave < 3; wave++) {
        const t = age - wave * 0.25; if (t <= 0 || t >= 1) continue;
        ctx.globalAlpha = 1 - t; ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 10 + 46 * t, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1.1) / 0.5); ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    } else {
      const alpha = age < life - 1 ? 1 : Math.max(0, life - age);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const [lw, style, a] of [[7, "#000", 0.35], [4, c, 1]]) {
        ctx.globalAlpha = alpha * a; ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.beginPath();
        m.points.forEach((p, i) => { const [x, y] = map(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (marks.length) requestAnimationFrame(render); else ctx.clearRect(0, 0, w, h);
}
</script></body></html>
