name = "mac-utils-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Режим аутентификации share: optional — принимаем и клиентов без ключа; required включают отдельно (.audit/auth-design.md).
[vars]
AUTH_MODE = "optional"

# Ограничения по IP до входа в Durable Object (Workers Rate Limiting, period только 10 или 60 с).
[[ratelimits]]
name = "RL_CONNECT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_STATUS"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
