<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Utils — трансляция экрана</title>
<style>
  :root { color-scheme: light dark; --accent: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; background: #111; color: #eee; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: #1c1c1e; flex-wrap: wrap; }
  header b { margin-right: auto; }
  input { font: inherit; width: 9em; padding: 6px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: inherit; letter-spacing: 2px; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: #3a3a3c; color: inherit; cursor: pointer; }
  button.primary { background: #0a84ff; } button.danger { background: var(--accent); }
  #stage { position: fixed; inset: 52px 0 0 0; display: flex; align-items: center; justify-content: center; }
  #screen, #video { max-width: 100%; max-height: 100%; object-fit: contain; }
  #video { display: none; }
  #marks { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tools { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; align-items: center;
           background: rgba(30,30,32,.85); padding: 6px 10px; border-radius: 999px; }
  #tools button.on { background: #0a84ff; }
  #tools .color { width: 16px; height: 16px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  #tools .color.on { border-color: #fff; }
  #status { position: absolute; padding: 10px 16px; border-radius: 10px; background: rgba(0,0,0,.6); }
  #live { display: none; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .muted { opacity: .65; font-size: 13px; }
  #picker { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; }
  #picker .box { background: #1c1c1e; border-radius: 14px; padding: 18px; width: min(900px, 94vw); max-height: 86vh; overflow: auto; }
  #picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 12px 0; }
  #picker .item { background: #2c2c2e; border-radius: 10px; padding: 8px; cursor: pointer; border: 2px solid transparent; }
  #picker .item:hover { border-color: #0a84ff; }
  #picker img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; }
  #request, #historyPanel { position: fixed; display: none; z-index: 11; }
  #request { inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; }
  #request .box { background: #1c1c1e; border-radius: 14px; padding: 20px; width: min(440px, 92vw); }
  #request .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  #historyPanel { top: 52px; right: 0; bottom: 0; width: min(360px, 100vw); background: #1c1c1e; overflow: auto; padding: 12px; border-left: 1px solid #333; }
  .entry { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; }
  .entry:hover { background: #2c2c2e; }
  .entry .live { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
  .entry .live.on { background: #30d158; }
  .entry .text { flex: 1; min-width: 0; } .entry .text div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry button { padding: 4px 8px; font-size: 13px; }
  #myId { font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  #picker .name { font-size: 13px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <b>Mac Utils · трансляция</b>
  <span class="muted">Мой ID:</span> <span id="myId" title="Скопировать"></span>
  <input id="code" inputmode="numeric" maxlength="13" placeholder="ID собеседника" style="width:11em">
  <button class="primary" id="watch">Смотреть</button>
  <button id="share">Транслировать свой экран</button>
  <span id="live"><span class="dot"></span><span id="liveText"></span><button class="danger" id="stop">Стоп</button></span>
  <button id="historyButton">История</button>
</header>
<div id="picker"><div class="box">
  <b>Что показывать?</b>
  <div class="grid" id="sources"></div>
  <label class="muted"><input type="checkbox" id="withAudio" checked style="width:auto"> Передавать звук системы</label>
  <div style="text-align:right; margin-top:10px"><button id="pickerCancel">Отмена</button></div>
</div></div>
<div id="request"><div class="box">
  <b id="requestTitle"></b>
  <p class="muted" id="requestText"></p>
  <div class="row">
    <button id="decline">Отклонить</button>
    <button id="always">Всегда разрешать</button>
    <button class="primary" id="allow">Разрешить</button>
  </div>
</div></div>
<div id="historyPanel"><b>История</b><p class="muted">Зелёная точка — сейчас в эфире.</p><div id="historyList"></div></div>
<div id="stage">
  <img id="screen" alt="">
  <canvas id="video"></canvas>
  <canvas id="marks"></canvas>
  <div id="tools">
    <button data-tool="ping" class="on" title="Клик — метка «сюда!» на экране ведущего">◎ Метка</button>
    <button data-tool="draw" title="Ведите мышью — линия на экране ведущего">✎ Рисовать</button>
    <button data-tool="off">Выкл</button>
    <span class="color on" data-color="red" style="background:#ff453a"></span>
    <span class="color" data-color="yellow" style="background:#ffd60a"></span>
    <span class="color" data-color="green" style="background:#30d158"></span>
    <span class="color" data-color="blue" style="background:#0a84ff"></span>
    <span class="color" data-color="white" style="background:#fff"></span>
  </div>
  <div id="status">Введите ID собеседника и нажмите «Смотреть» — или транслируйте свой экран.<br>
  <span class="muted">Свой ID сообщите тому, кто будет смотреть вас. Каждого зрителя вы сначала разрешаете.</span></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const wsBase = location.origin.replace(/^http/, "ws");
// Две независимые связи: смотреть кого-то и транслировать себя можно одновременно (смотреть друг друга).
let viewSocket = null, hostSocket = null, watchingId = null, audio = null, playAt = 0, lastUrl = null, capture = null;
let watching = false;
let forceKey = true;

function status(text) { $("status").innerHTML = text; $("status").style.display = text ? "" : "none"; }
function digits(text) { const d = text.replace(/\D/g, ""); return d.length === 10 || d.length === 6 ? d : null; }
function display(id) { return id.length === 10 ? `${id.slice(0, 3)} ${id.slice(3, 6)} ${id.slice(6)}` : id; }

// ---- Свой ID (постоянный, как в AnyDesk) ----
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } },
                set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
let myId = store.get("mu-id", null);
if (!myId) { myId = String(1 + Math.floor(Math.random() * 9)) + Array.from({ length: 9 }, () => Math.floor(Math.random() * 10)).join(""); store.set("mu-id", myId); }
const myName = (window.mu && window.mu.hostname) || "Windows";
$("myId").textContent = display(myId);
$("myId").onclick = () => navigator.clipboard?.writeText(myId);

// ---- История и доверенные ----
function history() { return store.get("mu-history", []); }
function saveHistory(list) { store.set("mu-history", list); renderHistory(); }
function visited(id, name) {
  const list = history(); let entry = list.find((e) => e.id === id);
  if (!entry) { entry = { id, name: "", label: "" }; list.push(entry); }
  if (name) entry.name = name; entry.last = Date.now(); saveHistory(list);
}
function trusted() { return store.get("mu-trusted", []); }
let live = new Set();

function renderHistory() {
  const list = history().sort((a, b) => (b.last || 0) - (a.last || 0));
  const box = $("historyList"); box.innerHTML = list.length ? "" : '<p class="muted">Здесь появятся те, к кому вы подключались.</p>';
  for (const e of list) {
    const row = document.createElement("div"); row.className = "entry";
    row.innerHTML = `<span class="live ${live.has(e.id) ? "on" : ""}"></span><div class="text"><div></div><div class="muted"></div></div>
      <button data-a="watch">Смотреть</button><button data-a="rename">✎</button><button data-a="del">✕</button>`;
    row.querySelector(".text div").textContent = e.label || e.name || display(e.id);
    row.querySelector(".text .muted").textContent = `${display(e.id)} · ${new Date(e.last || 0).toLocaleString()}${live.has(e.id) ? " · в эфире" : ""}`;
    row.querySelector('[data-a="watch"]').onclick = () => { $("code").value = e.id; watch(); };
    row.querySelector('[data-a="rename"]').onclick = () => {
      const label = prompt("Подпись", e.label || e.name || ""); if (label === null) return;
      const all = history(); all.find((x) => x.id === e.id).label = label.trim(); saveHistory(all);
    };
    row.querySelector('[data-a="del"]').onclick = () => saveHistory(history().filter((x) => x.id !== e.id));
    box.appendChild(row);
  }
}

async function refreshLive() {
  const ids = history().map((e) => e.id); if (!ids.length) return;
  try { const json = await (await fetch(`/status?ids=${ids.join(",")}`)).json(); live = new Set(Object.keys(json).filter((k) => json[k])); renderHistory(); } catch (_) {}
}
$("historyButton").onclick = () => { const p = $("historyPanel"); p.style.display = p.style.display === "block" ? "none" : "block"; refreshLive(); };
setInterval(refreshLive, 10000);
renderHistory(); refreshLive();

// ---- Метки и рисунки (как пинг в League of Legends) ----
// Координаты — доли кадра 0…1. Свои — рисуем сразу и шлём; чужие приходят текстом.
const COLORS = { red: "#ff453a", yellow: "#ffd60a", green: "#30d158", blue: "#0a84ff", white: "#ffffff" };
const marks = [];
let tool = "ping", color = "red", drawing = null;

function addMark(mark) { mark.born = performance.now(); marks.push(mark); if (marks.length === 1) requestAnimationFrame(renderMarks); }

function imageRect() {
  // Видео H.264 (холст) или картинка JPEG от старых версий.
  const useVideo = $("video").style.display === "block";
  const el = useVideo ? $("video") : $("screen");
  const nw = useVideo ? el.width : el.naturalWidth, nh = useVideo ? el.height : el.naturalHeight;
  const stage = $("stage").getBoundingClientRect(), box = el.getBoundingClientRect();
  if (!nw) return null;
  const scale = Math.min(box.width / nw, box.height / nh);
  const w = nw * scale, h = nh * scale;
  return { x: box.left - stage.left + (box.width - w) / 2, y: box.top - stage.top + (box.height - h) / 2, w, h };
}

function renderMarks() {
  const canvas = $("marks"), ctx = canvas.getContext("2d");
  const dpr = devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const rect = imageRect(), now = performance.now();
  for (let i = marks.length - 1; i >= 0; i--) {
    const m = marks[i], age = (now - m.born) / 1000, life = m.type === "ping" ? 1.6 : 5;
    if (age > life) { marks.splice(i, 1); continue; }
    if (rect) drawMark(ctx, m, age, life, (p) => [rect.x + p[0] * rect.w, rect.y + p[1] * rect.h]);
  }
  if (drawing && rect && drawing.length > 1) drawStroke(ctx, drawing, COLORS[color], 1, (p) => [rect.x + p[0] * rect.w, rect.y + p[1] * rect.h]);
  if (marks.length || drawing) requestAnimationFrame(renderMarks);
}

function drawMark(ctx, m, age, life, map) {
  const c = COLORS[m.color] || COLORS.red;
  if (m.type === "ping") {
    const [x, y] = map([m.x, m.y]);
    for (let wave = 0; wave < 3; wave++) {
      const t = age - wave * 0.25;
      if (t <= 0 || t >= 1) continue;
      ctx.globalAlpha = 1 - t; ctx.strokeStyle = c; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 10 + 46 * t, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 1.1) / 0.5);
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  } else {
    drawStroke(ctx, m.points, c, age < life - 1 ? 1 : Math.max(0, life - age), map);
  }
}

function drawStroke(ctx, points, c, alpha, map) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [width, style, a] of [[7, "#000", 0.35], [4, c, 1]]) {
    ctx.globalAlpha = alpha * a; ctx.strokeStyle = style; ctx.lineWidth = width; ctx.beginPath();
    points.forEach((p, i) => { const [x, y] = map(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function framePoint(event) {
  const rect = imageRect(), stage = $("stage").getBoundingClientRect();
  if (!rect) return null;
  const x = (event.clientX - stage.left - rect.x) / rect.w, y = (event.clientY - stage.top - rect.y) / rect.h;
  return x >= 0 && x <= 1 && y >= 0 && y <= 1 ? [x, y] : null;
}

function sendMark(mark) {
  addMark(mark);
  if (viewSocket && viewSocket.readyState === 1) viewSocket.send(JSON.stringify(mark));
}

$("marks").onpointerdown = (e) => {
  if (!watching || tool === "off") return;
  const p = framePoint(e); if (!p) return;
  if (tool === "ping") return sendMark({ type: "ping", x: p[0], y: p[1], color });
  drawing = [p]; requestAnimationFrame(renderMarks);
};
$("marks").onpointermove = (e) => { if (drawing) { const p = framePoint(e); if (p) drawing.push(p); } };
window.onpointerup = () => {
  if (!drawing) return;
  const step = Math.max(1, Math.floor(drawing.length / 300));
  const points = drawing.filter((_, i) => i % step === 0);
  drawing = null;
  if (points.length > 1) sendMark({ type: "stroke", points, color });
};
document.querySelectorAll("#tools [data-tool]").forEach((b) => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll("#tools [data-tool]").forEach((x) => x.classList.toggle("on", x === b));
  $("marks").style.cursor = tool === "off" ? "default" : "crosshair";
});
document.querySelectorAll("#tools .color").forEach((b) => b.onclick = () => {
  color = b.dataset.color;
  document.querySelectorAll("#tools .color").forEach((x) => x.classList.toggle("on", x === b));
});

// ---- Смотреть ----
function watch() {
  const id = digits($("code").value);
  if (!id) return status("ID — 10 цифр");
  if (id === myId) return status("Это ваш собственный ID");
  stopWatch();
  status("Подключаюсь…");
  watchingId = id;
  const h264 = typeof VideoDecoder !== "undefined" ? "&h264=1" : "";
  viewSocket = new WebSocket(`${wsBase}/room/${id}?role=viewer&viewer=${myId}&name=${encodeURIComponent(myName)}${h264}`);
  viewSocket.binaryType = "arraybuffer";
  viewSocket.onmessage = (event) => {
    if (typeof event.data === "string") {
      let m; try { m = JSON.parse(event.data); } catch (_) { return; }
      if (m.type === "heartbeat") {
        if (viewSocket && viewSocket.readyState === 1) viewSocket.send(JSON.stringify({ type: "heartbeat" }));
      }
      else if (m.type === "waiting") status(`Ждём, пока ${display(id)} разрешит подключение…`);
      else if (m.type === "accepted") { visited(id, m.name); status("Жду картинку…"); watching = true; $("tools").style.display = "flex"; $("marks").style.cursor = "crosshair"; }
      else if (m.type === "declined") { status("Вам не разрешили подключиться"); stopWatch(true); }
      else if (m.type === "ended") { status("Трансляция завершена"); stopWatch(true); }
      else if (m.type === "reconnecting") status("Ведущий переподключается…");
      else if (m.type === "resumed") status("");
      else if (m.type === "ping" || m.type === "stroke") addMark(m);
      return;
    }
    const bytes = new Uint8Array(event.data);
    if (bytes[0] === 1) {
      const url = URL.createObjectURL(new Blob([bytes.subarray(1)], { type: "image/jpeg" }));
      $("screen").src = url;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      status("");
    } else if (bytes[0] === 2) {
      playPCM(event.data.slice(1));
    } else if (bytes[0] === 3) {
      playH264(bytes.subarray(1));
    }
  };
  viewSocket.onclose = (event) => { if (event.code !== 1000 && viewSocket) status("Сейчас этот ID ничего не транслирует (или связь прервалась)"); };
}

// ---- Видео H.264: аппаратное декодирование WebCodecs ----
let decoder = null;
function nalUnits(data) {
  const units = []; let start = -1;
  for (let i = 0; i + 3 <= data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && (data[i + 2] === 1 || (data[i + 2] === 0 && data[i + 3] === 1))) {
      if (start >= 0) units.push(data.subarray(start, i));
      i += data[i + 2] === 1 ? 2 : 3; start = i + 1;
    }
  }
  if (start >= 0) units.push(data.subarray(start));
  return units;
}
let waitKey = false;
function playH264(bytes) {
  const key = bytes[0] === 1, data = bytes.subarray(1);
  if (!decoder || decoder.state === "closed") {
    if (!key || typeof VideoDecoder === "undefined") return;
    const sps = nalUnits(data).find((u) => (u[0] & 0x1f) === 7);
    if (!sps) return;
    const hex = (n) => n.toString(16).padStart(2, "0");
    const canvas = $("video"), ctx = canvas.getContext("2d");
    decoder = new VideoDecoder({
      output: (frame) => {
        if (canvas.width !== frame.displayWidth) { canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; }
        ctx.drawImage(frame, 0, 0); frame.close();
        if (canvas.style.display !== "block") { canvas.style.display = "block"; $("screen").style.display = "none"; status(""); }
      },
      error: () => { decoder = null; },
    });
    decoder.configure({ codec: `avc1.${hex(sps[1])}${hex(sps[2])}${hex(sps[3])}`, optimizeForLatency: true });
  }
  // Очередь растёт — компьютер не успевает: пропускаем до следующего ключевого кадра.
  if (decoder.decodeQueueSize > 4) waitKey = true;
  if (waitKey) { if (!key) return; waitKey = false; }
  decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: Math.round(performance.now() * 1000), data }));
}

function stopWatch(keepStatus) {
  if (decoder && decoder.state !== "closed") { try { decoder.close(); } catch (_) {} }
  decoder = null;
  $("video").style.display = "none"; $("screen").style.display = "";
  if (viewSocket) { viewSocket.onclose = null; viewSocket.close(1000); viewSocket = null; }
  watching = false; $("tools").style.display = "none";
  if (!keepStatus) { $("screen").removeAttribute("src"); }
}

function playPCM(buffer) {
  if (!audio) { audio = new AudioContext(); playAt = 0; }
  const ints = new Int16Array(buffer);
  const chunk = audio.createBuffer(1, ints.length, 24000);
  const data = chunk.getChannelData(0);
  for (let i = 0; i < ints.length; i++) data[i] = ints[i] / 32768;
  const source = audio.createBufferSource();
  source.buffer = chunk;
  source.connect(audio.destination);
  // Небольшой запас против рывков; если отстали — догоняем.
  if (playAt < audio.currentTime || playAt > audio.currentTime + 1) playAt = audio.currentTime + 0.15;
  source.start(playAt);
  playAt += chunk.duration;
}

// ---- Транслировать (приложение для Windows или браузер) ----
// В приложении для Windows (window.mu) — свой выбор экрана и окна с превью.
function pickSource() {
  return new Promise(async (resolve) => {
    let sources;
    try { sources = await window.mu.sources(); }
    catch (_) { status("Не удалось получить список экранов — разрешите приложению запись экрана"); return resolve(false); }
    const grid = $("sources");
    grid.innerHTML = "";
    for (const source of sources) {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<img src="${source.thumbnail}"><div class="name"></div>`;
      item.querySelector(".name").textContent = source.name;
      item.onclick = async () => {
        $("picker").style.display = "none";
        await window.mu.choose(source.id, $("withAudio").checked);
        resolve(true);
      };
      grid.appendChild(item);
    }
    $("pickerCancel").onclick = () => { $("picker").style.display = "none"; resolve(false); };
    $("picker").style.display = "flex";
  });
}

async function share() {
  stopHost();
  if (window.mu && !(await pickSource())) return status("Трансляция отменена");
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
  } catch (_) { return status("Трансляция отменена"); }
  const ok = await openHost(myId);
  if (!ok) { stream.getTracks().forEach((t) => t.stop()); return status("С вашим ID уже идёт трансляция или нет связи с сервером"); }
  startCapture(stream, myId);
}

function openHost(id) {
  return new Promise((resolve) => {
    const ws = new WebSocket(`${wsBase}/room/${id}?role=host`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { hostSocket = ws; resolve(true); };
    ws.onerror = () => resolve(false);
  });
}

// Зритель просится: доверенных пускаем сразу, остальных — по вопросу.
const requests = [];
function onRequest(viewer, name) {
  if (trusted().includes(viewer)) return answer(viewer, true);
  requests.push({ viewer, name }); showRequest();
}
function showRequest() {
  const r = requests[0]; if (!r) { $("request").style.display = "none"; return; }
  $("requestTitle").textContent = `${r.name} хочет посмотреть ваш экран`;
  $("requestText").textContent = `ID ${display(r.viewer)}. Зритель только смотрит и может ставить метки — управлять компьютером он не может.`;
  $("request").style.display = "flex";
  if (window.mu && window.mu.attention) window.mu.attention();
}
function answer(viewer, accept) {
  if (hostSocket && hostSocket.readyState === 1) hostSocket.send(JSON.stringify({ type: accept ? "accept" : "decline", viewer, name: myName }));
}
$("allow").onclick = () => { const r = requests.shift(); if (r) answer(r.viewer, true); showRequest(); };
$("always").onclick = () => { const r = requests.shift(); if (r) { store.set("mu-trusted", [...new Set([...trusted(), r.viewer])]); answer(r.viewer, true); } showRequest(); };
$("decline").onclick = () => { const r = requests.shift(); if (r) answer(r.viewer, false); showRequest(); };

function startCapture(stream, code) {
  const video = document.createElement("video");
  video.srcObject = stream;
  video.muted = true;
  video.play();
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  $("live").style.display = "flex";
  $("liveText").textContent = "В эфире · никто не смотрит";
  status(`Вы в эфире. Ваш ID: ${display(code)}`);
  hostSocket.onmessage = (event) => {
    if (typeof event.data !== "string") return;
    const msg = JSON.parse(event.data);
    // Метка или рисунок зрителя — на экран ведущего (в приложении для Windows — поверх всего).
    if ((msg.type === "ping" || msg.type === "stroke") && window.mu && window.mu.mark) window.mu.mark(msg);
    if (msg.type === "request") onRequest(msg.viewer, msg.name);
    if (msg.type === "viewers") forceKey = true; // новый зритель — сразу ключевой кадр
    if (msg.type === "cancelled") { const i = requests.findIndex((r) => r.viewer === msg.viewer); if (i >= 0) { requests.splice(i, 1); showRequest(); } }
    if (msg.type === "viewers") $("liveText").textContent = msg.count ? `В эфире · смотрят: ${(msg.list || []).map((v) => v.name).join(", ")}` : "В эфире · никто не смотрит";
  };
  hostSocket.onclose = () => reconnectHost(code);
  $("share").style.display = "none";
  // Видео H.264 через аппаратный кодек (WebCodecs), как в Discord; нет кодека — кадры JPEG.
  let encoder = null, frameIndex = 0, encodedSize = "";
  // Скорость под сеть: очередь в сокете растёт — снижаем, свободно — поднимаем.
  let bitrate = 3_000_000, encodedBitrate = 0, lastAdapt = 0;
  forceKey = true;
  const canEncode = typeof VideoEncoder !== "undefined";
  const timer = setInterval(() => {
    if (!hostSocket || hostSocket.readyState !== 1 || !video.videoWidth) { forceKey = true; return; }
    const now = performance.now(), queued = hostSocket.bufferedAmount;
    if (queued > 250_000 && now - lastAdapt > 500) { bitrate = Math.max(700_000, bitrate * 0.7); lastAdapt = now; }
    else if (queued < 60_000 && now - lastAdapt > 2000 && bitrate < 6_000_000) { bitrate = Math.min(6_000_000, bitrate * 1.15); lastAdapt = now; }
    // Больше ~1 с в очереди — пропускаем кадры, потом начинаем с ключевого.
    if (queued > Math.max(400_000, bitrate / 8)) { forceKey = true; return; }
    const scale = Math.min(1, 1600 / video.videoWidth);
    canvas.width = Math.round(video.videoWidth * scale / 2) * 2;
    canvas.height = Math.round(video.videoHeight * scale / 2) * 2;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (canEncode) {
      const size = `${canvas.width}x${canvas.height}`;
      if (encoder && encoder.state === "configured" && size === encodedSize && Math.abs(bitrate - encodedBitrate) > encodedBitrate * 0.2) {
        encodedBitrate = bitrate;
        encoder.configure({ codec: "avc1.4D4028", width: canvas.width, height: canvas.height, bitrate: Math.round(bitrate), framerate: 30,
                            latencyMode: "realtime", avc: { format: "annexb" }, hardwareAcceleration: "prefer-hardware" });
        forceKey = true;
      }
      if (!encoder || encoder.state === "closed" || size !== encodedSize) {
        try { encoder?.close(); } catch (_) {}
        encodedSize = size; forceKey = true;
        encoder = new VideoEncoder({
          output: (chunk) => {
            if (!hostSocket || hostSocket.readyState !== 1) return;
            const packet = new Uint8Array(chunk.byteLength + 2);
            packet[0] = 3; packet[1] = chunk.type === "key" ? 1 : 0;
            chunk.copyTo(packet.subarray(2));
            hostSocket.send(packet);
          },
          error: () => { encoder = null; },
        });
        encodedBitrate = bitrate;
        encoder.configure({ codec: "avc1.4D4028", width: canvas.width, height: canvas.height, bitrate: Math.round(bitrate), framerate: 30,
                            latencyMode: "realtime", avc: { format: "annexb" }, hardwareAcceleration: "prefer-hardware" });
      }
      if (encoder.encodeQueueSize > 2) return;
      const frame = new VideoFrame(canvas, { timestamp: Math.round(performance.now() * 1000) });
      encoder.encode(frame, { keyFrame: forceKey || frameIndex % 120 === 0 });
      frame.close(); forceKey = false; frameIndex++;
      return;
    }
    canvas.toBlob(async (blob) => {
      if (!blob || !hostSocket || hostSocket.readyState !== 1) return;
      const body = new Uint8Array(await blob.arrayBuffer());
      const packet = new Uint8Array(body.length + 1);
      packet[0] = 1; packet.set(body, 1);
      hostSocket.send(packet);
    }, "image/jpeg", 0.55);
  }, canEncode ? 33 : 125);
  let audioContext = null;
  if (stream.getAudioTracks().length) {
    // Частота — как у системы (48 кГц и т. п.); в 24 кГц пересчитываем сами: так работает во всех браузерах.
    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
    const processor = audioContext.createScriptProcessor(4096, 2, 1);
    const ratio = audioContext.sampleRate / 24000;
    processor.onaudioprocess = (event) => {
      if (!hostSocket || hostSocket.readyState !== 1) return;
      const left = event.inputBuffer.getChannelData(0);
      const right = event.inputBuffer.numberOfChannels > 1 ? event.inputBuffer.getChannelData(1) : left;
      const count = Math.floor(left.length / ratio);
      const packet = new DataView(new ArrayBuffer(count * 2 + 1));
      packet.setUint8(0, 2);
      for (let i = 0; i < count; i++) {
        const from = Math.floor(i * ratio), to = Math.max(from + 1, Math.floor((i + 1) * ratio));
        let sum = 0;
        for (let j = from; j < to; j++) sum += (left[j] + right[j]) / 2;
        const value = Math.max(-1, Math.min(1, sum / (to - from)));
        packet.setInt16(1 + i * 2, value * 32767, true);
      }
      hostSocket.send(packet.buffer);
    };
    source.connect(processor);
    processor.connect(audioContext.destination);
  }
  stream.getVideoTracks()[0].onended = () => stopHost("Трансляция остановлена");
  capture = { stream, timer, audioContext };
}

// Связь оборвалась — захват не останавливаем, переподключаемся с тем же ID (зрители ждут до 45 с).
async function reconnectHost(code) {
  if (!capture) return;
  const handlers = { onmessage: hostSocket?.onmessage };
  hostSocket = null;
  $("liveText").textContent = "Переподключаюсь…";
  for (const delay of [1, 2, 3, 5, 8, 10, 15]) {
    await new Promise((r) => setTimeout(r, delay * 1000));
    if (!capture) return;
    if (await openHost(code)) {
      hostSocket.onmessage = handlers.onmessage;
      hostSocket.onclose = () => reconnectHost(code);
      $("liveText").textContent = "В эфире";
      return;
    }
  }
  stopHost("Связь с сервером прервалась");
}

function stopHost(message) {
  if (capture) {
    clearInterval(capture.timer);
    capture.stream.getTracks().forEach((t) => t.stop());
    capture.audioContext?.close();
    capture = null;
  }
  if (hostSocket) { hostSocket.onclose = null; hostSocket.close(1000); hostSocket = null; }
  requests.length = 0; showRequest();
  $("live").style.display = "none";
  $("share").style.display = "";
  if (window.mu && window.mu.stopped) window.mu.stopped();
  if (message) status(message);
}

$("watch").onclick = watch;
$("code").onkeydown = (e) => { if (e.key === "Enter") watch(); };
$("share").onclick = share;
$("stop").onclick = () => stopHost("Трансляция остановлена");
if (window.mu) document.querySelector("header b").textContent = `Mac Utils Share ${window.mu.version}`;
const fromLink = new URLSearchParams(location.search).get("code");
if (fromLink) { $("code").value = fromLink; watch(); }
</script>
</body>
